<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Doomstop icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4dd"/>
      <stop offset="100%" stop-color="#ffd8a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7a2f13" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <polygon
      points="64,18 84,26 92,46 84,66 64,74 44,66 36,46 44,26"
      fill="#d9480f"
      stroke="#9c320c"
      stroke-width="3"
    />
    <text x="64" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">STOP</text>
  </g>

  <g transform="translate(34 64)">
    <polygon points="10,24 20,4 30,24" fill="#1f1c1a"/>
    <polygon points="34,24 44,4 54,24" fill="#1f1c1a"/>
    <ellipse cx="32" cy="38" rx="28" ry="24" fill="#1f1c1a"/>
    <circle cx="22" cy="36" r="3" fill="#fff9eb"/>
    <circle cx="42" cy="36" r="3" fill="#fff9eb"/>
    <path d="M28 46 Q32 50 36 46" stroke="#fff9eb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
