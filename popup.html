<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doomstop</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5ef;
        --card: #fff9eb;
        --ink: #1f1c1a;
        --muted: #5f5952;
        --accent: #d9480f;
        --accent-2: #ffd8a8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 300px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at top right, #ffe8cc, var(--bg));
        color: var(--ink);
      }

      main {
        padding: 14px;
      }

      .card {
        background: linear-gradient(160deg, var(--card), #fffaf0);
        border: 1px solid #f0dfc4;
        border-radius: 12px;
        padding: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p {
        margin: 6px 0;
      }

      .time {
        margin-top: 10px;
        padding: 10px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #eed9be;
      }

      .time strong {
        display: block;
        font-size: 22px;
        letter-spacing: 0.3px;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      button {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        color: #fff;
        background: linear-gradient(180deg, #f76707, var(--accent));
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      button:active {
        transform: translateY(1px);
      }

      .limit {
        margin-top: 10px;
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--accent-2);
        font-size: 12px;
      }

      .settings {
        margin-top: 12px;
      }

      .settings label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .settings select {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ead5b5;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
      }

      .filter-list {
        margin-top: 8px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ead5b5;
        background: #fff;
      }

      .filter-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--ink);
      }

      .filter-item + .filter-item {
        margin-top: 6px;
      }

      .filter-item input {
        accent-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Doomstop</h1>
        <p>Current doomscroll session</p>
        <div class="time">
          <strong id="timeValue">0m 0s</strong>
          <span class="muted" id="statusText">Below limit</span>
        </div>
        <span class="limit" id="limitBadge">Prompt at 10 minutes</span>
        <div class="settings">
          <label for="limitSelect">Alarm after</label>
          <select id="limitSelect">
            <option value="60">1 minute</option>
            <option value="180">3 minutes</option>
            <option value="300">5 minutes</option>
            <option value="480">8 minutes</option>
            <option value="600">10 minutes</option>
          </select>
        </div>
        <div class="settings">
          <label for="messageSelect">Motivation message</label>
          <select id="messageSelect">
            <option value="Good Job">Good Job</option>
            <option value="Good Boy">Good Boy</option>
            <option value="Good Girl">Good Girl</option>
          </select>
        </div>
        <div class="settings">
          <label>Tracked services</label>
          <div id="filterList" class="filter-list"></div>
        </div>
        <button id="resetBtn" type="button">Reset current session</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
